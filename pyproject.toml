[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr40"
version = "0.0.1a1"
description = "CKD-PC risk equation for a >=40% eGFR decline or kidney failure over 2-3 years (Grams et al., Diabetes Care 2022)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leonid Shpaner", email = "lshpaner@ucla.edu" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "pandas>=1.3"]
keywords = ["nephrology", "ckd", "egfr", "risk prediction", "ckd-pc", "kidney"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]
nhanes = ["requests", "typer", "pyarrow"]

[project.urls]
Homepage = "https://github.com/lshpaner/egfr40"
Issues = "https://github.com/lshpaner/egfr40/issues"

[tool.setuptools]
packages = ["egfr40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
