name: Publish to PyPI

# Runs when a GitHub release is published (the same event Zenodo archives).
# Manual runs (workflow_dispatch) build and test only; they never publish.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject: $PKG_VERSION  tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test wheel on Python ${{ matrix.python-version }}
    needs: build
    # Pinned: Python 3.8-3.10 builds may be missing on newer runner images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the built wheel and run tests against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          # empty pythonpath so tests import the installed wheel, not src/
          python -m pytest -q -o pythonpath=

  publish:
    name: Publish to PyPI
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/egfr40/
    permissions:
      id-token: write   # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
