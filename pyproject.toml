[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr40"
version = "0.0.1a3"
description = "CKD-PC risk equation for a >=40% eGFR decline or kidney failure over 2-3 years (Grams et al., Diabetes Care 2022)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leonid Shpaner", email = "lshpaner@ucla.edu" }]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "pandas>=1.3"]
keywords = ["nephrology", "ckd", "egfr", "risk prediction", "ckd-pc", "kidney"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "build", "twine", "nbstripout"]
nhanes = ["requests", "typer", "pyarrow", "openpyxl", "ipykernel", "model_metrics"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-copybutton", "myst-nb", "ipykernel"]

[project.urls]
Homepage = "https://github.com/lshpaner/egfr40"
Documentation = "https://lshpaner.github.io/egfr40"
Issues = "https://github.com/lshpaner/egfr40/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/egfr40"]
branch = false
